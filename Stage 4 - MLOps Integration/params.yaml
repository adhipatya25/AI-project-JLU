# Pipeline parameters (read by src/*.py, tracked by DVC, logged to MLflow).
# Values reproduce the Stage 3 final model (Gradient Boosting, 93.59% test accuracy).

data:
  path: data/football_players.csv
  target: Player_Future_Potential_Rating
  test_size: 0.2
  random_state: 42

model:
  name: GradientBoostingClassifier
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 3
  min_samples_split: 2
  min_samples_leaf: 2
  subsample: 0.8
  random_state: 42

mlflow:
  experiment: football-player-potential
  registered_model: football-potential-gb

monitoring:
  # Evidently: share of drifted columns above which the pipeline warns
  drift_share_threshold: 0.3
  # minimum stored Django predictions before a production drift report is made.
  # Evidently's distance tests (threshold 0.1) flag almost every column on tiny
  # samples - even 31 random rows of the training data itself - so wait for 200.
  min_production_rows: 200
